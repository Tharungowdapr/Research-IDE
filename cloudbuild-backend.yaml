steps:
  # Step 1: Build the backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/research-ide-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/research-ide-backend:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'research-ide-backend' # Service name
      - '--image=gcr.io/$PROJECT_ID/research-ide-backend:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=2'
      - '--port=8000'
      - '--update-secrets=SECRET_KEY=secret-key:latest,ENCRYPTION_KEY=encryption-key:latest,GEMINI_API_KEY=gemini-api-key:latest' # Pass secrets as environment variables

images:
  - 'gcr.io/$PROJECT_ID/research-ide-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'research-ide-backend'
  _MEMORY: '512Mi'
  _CPU: '1'
  _MAX_INSTANCES: '2'
