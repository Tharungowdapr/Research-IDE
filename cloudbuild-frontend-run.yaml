steps:
  # Step 1: Build Docker image for frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/research-ide-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://research-ide-backend-6vx3cdjepa-el.a.run.app'
      - 'frontend/'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/research-ide-frontend:latest'

  # Step 3: Deploy to Cloud Run with environment variable
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'research-ide-frontend'
      - '--image=gcr.io/$PROJECT_ID/research-ide-frontend:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--port=3000'
      - '--set-env-vars=NEXT_PUBLIC_API_URL=https://research-ide-backend-6vx3cdjepa-el.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/research-ide-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
