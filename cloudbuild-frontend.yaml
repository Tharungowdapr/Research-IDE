steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    dir: 'frontend'
    args: ['npm', 'ci']

  # Step 2: Build Next.js application
  - name: 'node:20'
    dir: 'frontend'
    args: ['npm', 'run', 'build']

  # Step 3: Upload static files to Cloud Storage
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - 'cp'
      - '-r'
      - 'frontend/.next/static'
      - 'gs://research-ide-static-gen-lang-client-0492292104/'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'

  # Step 4: Upload public files with cache headers
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Set cache control headers for static assets
        gsutil -h "Cache-Control:public, max-age=31536000" \
          -m cp -r frontend/.next/static/* \
          gs://research-ide-static-gen-lang-client-0492292104/.next/static/ || true
        
        # Set shorter cache for HTML
        gsutil -h "Cache-Control:public, max-age=3600" \
          -m cp frontend/.next/server/pages/*.html \
          gs://research-ide-static-gen-lang-client-0492292104/ || true

  # Step 5: Grant public read access via IAM
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'storage'
      - 'buckets'
      - 'add-iam-policy-binding'
      - 'gs://research-ide-static-gen-lang-client-0492292104'
      - '--member=allUsers'
      - '--role=roles/storage.objectViewer'
      - '--quiet'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'
